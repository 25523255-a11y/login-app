<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lupa Password - Login App</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <div class="card">
      <!-- TAHAP 1: Minta email untuk dikirimkan link reset -->
      <div id="requestSection">
        <div class="card-header">
          <h1>Lupa Password?</h1>
          <p>Masukkan email Anda, kami akan mengirimkan link untuk reset password</p>
        </div>

        <div id="alertBox" class="alert"></div>

        <form id="requestForm" novalidate>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Masukkan email terdaftar" />
            <div class="field-error" id="emailError">Email tidak valid.</div>
          </div>

          <button type="submit" class="btn" id="requestBtn">Kirim Link Reset</button>
        </form>
      </div>

      <!-- TAHAP 2: Muncul otomatis saat user datang dari link email reset -->
      <div id="updateSection" style="display:none;">
        <div class="card-header">
          <h1>Buat Password Baru</h1>
          <p>Masukkan password baru untuk akun Anda</p>
        </div>

        <div id="alertBoxUpdate" class="alert"></div>

        <form id="updateForm" novalidate>
          <div class="form-group">
            <label for="newPassword">Password Baru</label>
            <div class="password-wrapper">
              <input type="password" id="newPassword" placeholder="Minimal 6 karakter" />
              <button type="button" class="toggle-password" data-target="newPassword">Lihat</button>
            </div>
            <div class="field-error" id="newPasswordError">Password minimal 6 karakter.</div>
          </div>

          <div class="form-group">
            <label for="confirmNewPassword">Konfirmasi Password Baru</label>
            <div class="password-wrapper">
              <input type="password" id="confirmNewPassword" placeholder="Ulangi password baru" />
              <button type="button" class="toggle-password" data-target="confirmNewPassword">Lihat</button>
            </div>
            <div class="field-error" id="confirmNewPasswordError">Konfirmasi password tidak sama.</div>
          </div>

          <button type="submit" class="btn" id="updateBtn">Simpan Password Baru</button>
        </form>
      </div>

      <p class="footer-text">
        <a href="index.html" class="link">Kembali ke halaman login</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
